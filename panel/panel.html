<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="./panel.css" />
</head>
<body>
  <header>
    <span id="logo"></span>
    <h1>模型用量统计</h1>
    <select id="range">
      <option value="today">今日</option>
      <option value="yesterday">昨天</option>
      <option value="7d">近 7 天</option>
      <option value="all">全部</option>
    </select>
    <button id="btn-theme" title="主题：跟随系统（点击切换）">跟随</button>
    <button id="btn-close" title="关闭" aria-label="关闭">×</button>
  </header>
  <div id="hint" class="hint" hidden>
    <p>请先在完整页完成目录授权。</p>
    <button id="btn-open2" class="primary">打开完整统计</button>
  </div>
  <table id="table">
    <thead><tr><th>模型</th><th>合计 tokens</th><th>命中率</th><th>平均 tokens/s</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="foot-cost">估算花费总计：<span id="total-cost">—</span><span id="foot-tou" class="foot-tou"></span></div>
  <footer>
    <button id="btn-open" class="primary">查看完整统计 →</button>
    <button id="btn-rescan" class="ghost">刷新</button>
  </footer>
  <script type="module" src="./panel.js"></script>
</body>
</html>
